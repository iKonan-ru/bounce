<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta name="theme-color" content="#161a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bounce" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bounce</title>
    <script>
      // тема до первой отрисовки, без вспышки светлого экрана (то же решает lib/theme.ts);
      // заодно цвет строки состояния и рамки окна - в цвет фона темы
      try {
        const dark =
          localStorage.getItem('bounce.theme') === 'dark' ||
          (localStorage.getItem('bounce.theme') !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#161a22' : '#eef0f3');
      } catch (error) {
        console.error(error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

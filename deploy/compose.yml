# Bounce на сервере: /opt/bounce/compose.yml (кладёт tools/deploy.sh). Исходники - в ./src,
# образ собирается на сервере; данные PocketBase - в ./pb_data. Наружу порты не открыты:
# Caddy ходит к контейнеру (bounce:8090) по общей сети Docker BOUNCE_NETWORK (DEPLOY_NETWORK).
name: bounce

services:
  bounce:
    image: bounce:local
    build:
      context: ./src
    restart: unless-stopped
    environment:
      BOUNCE_URL: https://${BOUNCE_DOMAIN:?BOUNCE_DOMAIN не задан в .env}
      TZ: Europe/Moscow
      # временные файлы загрузок - на томе данных, а не в маленьком /tmp в памяти
      TMPDIR: /pb/pb_data/.pb_temp_to_delete/uploads
    volumes:
      - ./pb_data:/pb/pb_data
    networks: [proxy]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 320m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  proxy:
    name: ${BOUNCE_NETWORK:?BOUNCE_NETWORK не задан в .env}
    external: true

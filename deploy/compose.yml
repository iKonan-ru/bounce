# Bounce на сервере: /opt/bounce/compose.yml (кладёт tools/deploy.sh). Исходники - в ./src,
# образ собирается на сервере; данные PocketBase - в ./pb_data. Наружу порты не открыты:
# Caddy ходит к контейнеру по сети Caddy (/etc/caddy/sites/bounce.caddy).
name: bounce

services:
  bounce:
    image: bounce:local
    build:
      context: ./src
    restart: unless-stopped
    environment:
      BOUNCE_URL: https://${BOUNCE_DOMAIN:?BOUNCE_DOMAIN не задан в .env}
      TZ: Europe/Moscow
    volumes:
      - ./pb_data:/pb/pb_data
    networks: [panel]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 160m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  panel:
    name: caddy
    external: true
